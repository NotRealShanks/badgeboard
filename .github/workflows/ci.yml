name: CI

on:
  push:
    branches: [ main, web-app ]
  pull_request:
    branches: [ main, web-app ]

jobs:
  lint:
    name: Golangci-lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m

  test:
    name: Test (${{ matrix.tz }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Asia/Kolkata]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify No Drift (make pages)
        run: |
          make pages
          git diff --exit-code docs/app.js docs/index.html docs/style.css docs/render.js docs/report.js docs/csv.js docs/demo-data.js

      - name: Run Frontend Unit Tests
        run: node --test internal/web/assets/frontend.test.js

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: latest
          install-dependencies: true

      - name: Run Headless Overflow and Dev Banner Checks
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          echo "Using Chrome at: ${{ steps.setup-chrome.outputs.chrome-path }}"
          node --experimental-websocket scripts/check_overflow.js 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Go Vet
        run: go vet ./...

      - name: Run Tests (-race -cover)
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./... 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify Coverage
        run: go tool cover -func=coverage.txt 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  docker:
    name: Docker Build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t badgeboard:test .
